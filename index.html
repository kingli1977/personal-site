<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#08080a" />
    <meta
      name="description"
      content="专注 AI 实操——每篇都来自真实上手，装过、跑过、踩过坑才写"
    />
    <title>【公众号名称】</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>
    <div class="wrap">
      <header class="hero">
        <p class="eyebrow">公众号</p>
        <h1>【公众号名称】</h1>
        <p class="lede">专注 AI 实操——每篇都来自真实上手，装过、跑过、踩过坑才写</p>
      </header>

      <main>
        <section class="cards" aria-label="栏目介绍">
          <article class="card">
            <span class="card-index" aria-hidden="true">01</span>
            <h2>写什么</h2>
            <p>AI 工作流实测拆解</p>
          </article>
          <article class="card">
            <span class="card-index" aria-hidden="true">02</span>
            <h2>怎么写</h2>
            <p>亲自跑通再写，配真实截图和步骤</p>
          </article>
          <article class="card">
            <span class="card-index" aria-hidden="true">03</span>
            <h2>更新节奏</h2>
            <p>每周更新</p>
          </article>
        </section>

        <section class="articles" aria-labelledby="articles-title">
          <h2 id="articles-title">往期文章</h2>
          <ul id="article-list" class="article-list"></ul>
        </section>
      </main>

      <footer class="action">
        <p class="action-label">关注</p>
        <p class="action-id">【微信号占位】</p>
      </footer>
    </div>
    <script src="articles.js"></script>
  </body>
</html>
